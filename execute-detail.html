<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Detalle de un execute de Counter-Strike 2.">
  <title>Execute · EsboSmokes</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/execute.css">
</head>
<body>
  <div data-site-header></div>

  <main>
    <section class="page-head">
      <div class="container">
        <span class="eyebrow" data-execute-breadcrumb>Execute</span>
        <h1 data-execute-title>Execute</h1>
        <p class="lead" data-execute-description></p>
        <div class="meta" data-execute-meta></div>
      </div>
    </section>

    <section class="section">
      <div class="container detail-grid">
        <div>
          <section data-video-section>
            <div class="section-head execute-video-heading">
              <div>
                <span class="eyebrow">Demostraciones</span>
                <h2>Vídeos</h2>
              </div>
            </div>
            <div class="execute-video-list" data-execute-videos></div>
          </section>

          <div class="detail-panel" style="margin-top:18px">
            <h2>Cómo ejecutarlo</h2>
            <ol class="steps" data-execute-steps></ol>
          </div>
        </div>

        <aside class="detail-panel">
          <h2>Detalles</h2>
          <div class="detail-list" data-execute-details></div>
        </aside>
      </div>
    </section>

    <section class="section" data-gallery-section>
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Referencias visuales</span>
            <h2>Fotografías</h2>
          </div>
        </div>
        <div class="execute-gallery" data-execute-gallery></div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <script src="js/common.js"></script>
  <script src="js/execute-detail.js"></script>
</body>
</html>
