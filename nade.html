<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tutorial detallado de una granada de CS2.">
  <title>Lineup · EsboSmokes</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/nade-multiple-videos.css?v=15">
</head>
<body>
  <div data-site-header></div>
  <main>
    <section class="page-head">
      <div class="container">
        <span class="eyebrow" data-breadcrumb></span>
        <div class="page-head-row">
          <div>
            <h1 data-title>Lineup</h1>
            <p class="lead" data-description></p>
            <div class="route" data-route></div>
          </div>
          <button class="btn" data-detail-favorite type="button">☆ Guardar</button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container detail-grid">
        <div>
          <div class="reference-image" data-reference-image-wrap hidden>
            <img data-reference-image src="" alt="">
          </div>

          <div class="nade-video-viewer" data-video-viewer></div>
          <div class="detail-panel" style="margin-top:18px">
            <h2>Cómo lanzarla</h2>
            <ol class="steps" data-steps></ol>
          </div>
          <div class="detail-panel" style="margin-top:18px" data-setpos-wrap>
            <h3>Comando de práctica</h3>
            <div class="code-box"><code data-setpos></code><button class="btn" data-copy-setpos type="button">Copiar</button></div>
          </div>
        </div>
        <aside class="detail-panel">
          <h2>Detalles</h2>
          <div class="detail-list" data-details></div>
        </aside>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head"><h2>Más del mismo mapa</h2></div>
        <div class="grid nade-grid" data-related-grid></div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="js/common.js"></script>
  <script src="js/nade.js?v=15"></script>
</body>
</html>
